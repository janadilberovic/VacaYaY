name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Backend build and tests
    runs-on: ubuntu-latest

    services:
      # Port 3307 and these credentials are dictated by the hardcoded connection
      # string in LeaveRequestServiceIntegrationTests; the container matches the test.
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test1234
          MYSQL_DATABASE: vacayay_test
        ports:
          - 3307:3306
        # Docker reports the container up seconds before MySQL accepts connections,
        # and the tests call EnsureDeleted() immediately — without this they flake.
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest1234"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - run: dotnet restore VacaYAY.sln

      - run: dotnet build VacaYAY.sln --configuration Release --no-restore

      - run: dotnet test VacaYAY.sln --configuration Release --no-build --verbosity normal

  web:
    name: Frontend typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run typecheck

  deploy-api:
    name: Deploy API to Render
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy hook
        run: curl --fail --silent --show-error --request POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-web:
    name: Deploy web to Vercel
    needs: [test, web]
    runs-on: ubuntu-latest
    env:
      # .vercel/ is gitignored, so the CLI gets the project identity from here instead.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --global vercel@latest

      # Run from the repo root: the Vercel project's own Root Directory setting is
      # `web`, and the CLI applies it relative to where it is invoked.
      - name: Deploy preview
        if: github.event_name == 'pull_request'
        run: |
          vercel pull --yes --environment=preview
          vercel build
          url=$(vercel deploy --prebuilt)
          echo "Preview: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy production
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          vercel pull --yes --environment=production
          vercel build --prod
          url=$(vercel deploy --prebuilt --prod)
          echo "Production: $url" >> "$GITHUB_STEP_SUMMARY"
